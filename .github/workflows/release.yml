name: release

# Push a tag like v0.1.0 (matching package.json) to publish a GitHub Release with a prebuilt
# package. Installing that tarball needs no build step and no allowBuilds approval.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Pack
        run: |
          pnpm pack
          version="${GITHUB_REF_NAME#v}"
          mv "dsh-gh-pages-artifacts-${version}.tgz" dsh-gh-pages-artifacts.tgz
          cp dsh-gh-pages-artifacts.tgz "dsh-gh-pages-artifacts-${version}.tgz"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dsh-gh-pages-artifacts.tgz "dsh-gh-pages-artifacts-${GITHUB_REF_NAME#v}.tgz" --title "$GITHUB_REF_NAME" --generate-notes
